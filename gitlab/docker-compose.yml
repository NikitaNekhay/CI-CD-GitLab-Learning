services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: st19-gitlab
    hostname: st19.sne.com
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://st19.sne.com'
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "gitlab-postfix"
        gitlab_rails['smtp_port'] = 25
        gitlab_rails['smtp_domain'] = "sne.com"
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['smtp_openssl_verify_mode'] = 'none'
        gitlab_rails['smtp_enable_starttls_auto'] = false
        gitlab_rails['smtp_authentication'] = false
        gitlab_rails['gitlab_email_from'] = 'gitlab@sne.com'
        gitlab_rails['gitlab_email_reply_to'] = 'noreply@sne.com'
    networks:
      - gitlab-network
    ports:
      - "80:80"
      - "443:443"
      - "22:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: '256m'
    restart: unless-stopped

networks:
  gitlab-network:
    external: true

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
