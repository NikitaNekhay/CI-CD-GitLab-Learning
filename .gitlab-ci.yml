stages:
  - build
  - test
  - docker-build
  - docker-push
  - deploy

variables:
  DOCKER_IMAGE_NAME: "nikitanekhay/st19-spa"
  DOCKER_IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  ANSIBLE_FORCE_COLOR: "true"

# Cache configuration - reuse dependencies across jobs
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .npm/
  policy: pull-push

# CI Stage 1: Build the application
build-app:
  stage: build
  tags:
    - st19-runner
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - echo "Starting build on branch ${CI_COMMIT_REF_NAME}"
  script:
    - echo "Building the application..."
    - ls -la
    - echo "Build completed successfully"
  artifacts:
    name: "build-${CI_COMMIT_SHORT_SHA}"
    paths:
      - .
      - Dockerfile
    expire_in: 1 hour
    when: on_success
  only:
    - main
    - develop
    - merge_requests

# CI Stage 2: Run tests
test-app:
  stage: test
  tags:
    - st19-runner
  needs:
    - job: build-app
      artifacts: true
  dependencies:
    - build-app
  script:
    - echo "Running application tests on branch ${CI_COMMIT_REF_NAME}..."
    - test -f index.html && echo "✓ index.html exists"
    - test -f Dockerfile && echo "✓ Dockerfile exists"
    - echo "All tests passed!"
  only:
    - main
    - develop
    - merge_requests

# CI Stage 3: Build Docker image
build-docker:
  stage: docker-build
  tags:
    - st19-runner
  needs:
    - job: test-app
    - job: build-app
      artifacts: true
  dependencies:
    - build-app
  script:
    - echo "Building Docker image for branch ${CI_COMMIT_REF_NAME}..."
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker build -t ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG} .
        docker build -t ${DOCKER_IMAGE_NAME}:latest .
        docker build -t ${DOCKER_IMAGE_NAME}:production .
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        docker build -t ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG} .
        docker build -t ${DOCKER_IMAGE_NAME}:develop .
      else
        docker build -t ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG} .
      fi
    - docker images | grep st19-spa
  only:
    - main
    - develop

# CI Stage 4: Push to Docker Hub
push-docker:
  stage: docker-push
  tags:
    - st19-runner
  needs:
    - job: build-docker
  dependencies: []
  script:
    - echo "Logging into Docker Hub..."
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
    - echo "Pushing Docker image for branch ${CI_COMMIT_REF_NAME}..."
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker push ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}
        docker push ${DOCKER_IMAGE_NAME}:latest
        docker push ${DOCKER_IMAGE_NAME}:production
        echo "Pushed production tags"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        docker push ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}
        docker push ${DOCKER_IMAGE_NAME}:develop
        echo "Pushed develop tag"
      fi
    - docker logout
  only:
    - main
    - develop

# CD Stage: Deploy to Production using Ansible (main branch only)
deploy-production:
  stage: deploy
  tags:
    - st19-runner
  needs:
    - job: push-docker
  dependencies: []
  environment:
    name: production
    url: http://deploy.st19.sne.com:8080
  before_script:
    - echo "Preparing Ansible deployment to production..."
  script:
    - echo "Deploying to production using Ansible..."
    - cd ansible
    - |
      ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
        -i inventory.ini \
        deploy-playbook.yml \
        -e "docker_image_name=${DOCKER_IMAGE_NAME}" \
        -v
    - echo "Production deployment completed!"
    - echo "Application available at: http://deploy.st19.sne.com:8080"
  after_script:
    - ssh deploy-server "docker ps | grep st19-spa"
  only:
    - main
  when: manual

# CD Stage: Deploy to Staging using Ansible (develop branch)
deploy-staging:
  stage: deploy
  tags:
    - st19-runner
  needs:
    - job: push-docker
  dependencies: []
  environment:
    name: staging
    url: http://deploy.st19.sne.com:8081
  script:
    - echo "Deploying to staging using Ansible..."
    - cd ansible
    - |
      ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
        -i inventory.ini \
        deploy-playbook.yml \
        -e "docker_image_name=${DOCKER_IMAGE_NAME}" \
        -e "container_name=st19-spa-staging" \
        -e "container_port=8081" \
        -v
    - echo "Staging deployment completed!"
    - echo "Application available at: http://deploy.st19.sne.com:8081"
  only:
    - develop
  when: on_success

# Optional: Rollback job (manual trigger)
rollback-production:
  stage: deploy
  tags:
    - st19-runner
  script:
    - echo "Rolling back production deployment..."
    - ssh deploy-server "docker stop st19-spa && docker rm st19-spa"
    - ssh deploy-server "docker run -d --name st19-spa -p 8080:80 ${DOCKER_IMAGE_NAME}:production"
  only:
    - main
  when: manual